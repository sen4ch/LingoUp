packages:
  - apps/*
  - packages/*

# Dependency install scripts are blocked by default (supply-chain hardening).
# Only packages listed here may run them.
allowBuilds:
  esbuild: true
  '@swc/core': true
  # Install-time telemetry pulled in by swagger-ui-dist.
  '@scarf/scarf': false
  # Optional native speed-up for msgpackr (BullMQ); the pure-JS fallback is used instead.
  msgpackr-extract: false
  # Native binary ships via optionalDependencies; the fallback script is not needed.
  unrs-resolver: false

overrides:
  # GHSA-67mh-4wv8-2f99: drizzle-kit pulls esbuild <=0.24 via @esbuild-kit (dev tool only).
  '@esbuild-kit/core-utils>esbuild': 0.25.12
