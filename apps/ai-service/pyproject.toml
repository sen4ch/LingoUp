[project]
name = "lingoup-ai-service"
version = "0.1.0"
description = "AI inference gateway for the Open English Learning Platform (mock, Ollama, OpenAI-compatible)."
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "respx==0.23.1",
  "ruff==0.17.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
